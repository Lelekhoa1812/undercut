name: Release skill bundle

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate package
        run: |
          python scripts/undercut.py check
          python scripts/evaluate_cases.py --check
          python -m unittest discover -s tests -v
      - name: Package skill
        run: python scripts/undercut.py bundle --output dist/undercut-skill.zip
      - name: Attach workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: undercut-skill
          path: dist/undercut-skill.zip
          if-no-files-found: error
